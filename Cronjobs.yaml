apiVersion: batch/v1
kind: CronJob
metadata:
  name: mybackup-cronjobs
spec:
  schedule: "0 2 * * *"  # Run daily at midnight
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: mybackup-image
              image: busybox
              ports:
              command: [""]
          restartPolicy: Never

